<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Workshop admin | Adoption Tales Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

<div id="loginView" hidden>
  <form class="a-login" id="loginForm">
    <h1>Workshop admin</h1>
    <p class="sub">Sign in to manage bears, adoptions and messages.</p>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="form-status bad" id="loginMsg" role="alert" style="margin:10px 0"></p>
    <button class="btn btn-gold" type="submit" style="width:100%">Sign in</button>
    <p class="sub" style="margin-top:18px;font-size:.88rem"><a href="/">Back to the site</a></p>
  </form>
</div>

<div id="appView" class="a-wrap" hidden>
  <div class="a-top">
    <h1>Workshop admin</h1>
    <div class="row-actions">
      <a class="btn btn-line mini" href="/" target="_blank" rel="noopener">View site</a>
      <button class="btn btn-line mini" id="refresh" type="button">Refresh</button>
      <button class="btn btn-line mini" id="logout" type="button">Sign out</button>
    </div>
  </div>

  <div class="banner" id="memBanner" hidden>Data is currently stored in temporary memory and will reset. Connect Supabase (see README) to keep orders and bears permanently.</div>

  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="chip" role="tab" data-tab="orders" aria-pressed="true">Adoptions</button>
    <button class="chip" role="tab" data-tab="bears" aria-pressed="false">Bears</button>
    <button class="chip" role="tab" data-tab="messages" aria-pressed="false">Messages</button>
    <button class="chip" role="tab" data-tab="subs" aria-pressed="false">Newsletter</button>
  </div>

  <div id="panel"></div>
</div>

<script src="/js/admin.js" defer></script>
</body>
</html>
